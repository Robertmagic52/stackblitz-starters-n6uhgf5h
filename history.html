<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Summary History | iControl Magic</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white">
  <div class="max-w-3xl mx-auto px-4 py-10">
    
    <!-- Header -->
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
          <span>⚡</span> AI Summary History
        </h1>
        <p class="text-sm text-slate-400 mt-1">Logged summaries captured from your shortcuts and workflows.</p>
      </div>
      <button onclick="loadSummaries()" class="inline-flex items-center justify-center gap-2 text-xs font-medium bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl transition shadow-sm active:scale-95">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        Refresh
      </button>
    </header>

    <!-- Search Bar -->
    <div class="mb-6 relative">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </span>
      <input type="text" id="search-input" oninput="filterSummaries()" placeholder="Search summaries by title or content..." class="w-full bg-slate-900/80 border border-slate-800/80 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition shadow-inner">
    </div>

    <!-- History Container -->
    <div id="history-list" class="space-y-4">
      <div class="bg-slate-900/50 border border-slate-900 rounded-2xl p-12 text-center">
        <div class="animate-pulse flex flex-col items-center gap-3">
          <div class="w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
          <p class="text-sm text-slate-500">Loading your history...</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    let allSummaries = [];

    async function loadSummaries() {
      const container = document.getElementById('history-list');
      try {
        const res = await fetch('/api/summaries');
        const data = await res.json();
        
        if (!data.success || !data.summaries || data.summaries.length === 0) {
          container.innerHTML = `
            <div class="bg-slate-900/40 border border-slate-900 rounded-2xl p-12 text-center text-slate-500">
              <p class="text-base font-medium text-slate-400">No summaries received yet</p>
              <p class="text-xs mt-1">Send a POST request to <code class="text-indigo-400">/api/summaries/submit</code> to log your first entry.</p>
            </div>`;
          return;
        }

        allSummaries = data.summaries;
        renderSummaries(allSummaries);
      } catch (err) {
        container.innerHTML = `
          <div class="bg-red-950/20 border border-red-900/50 rounded-2xl p-8 text-center text-red-400 text-sm">
            Failed to load history from the server.
          </div>`;
      }
    }

    function renderSummaries(items) {
      const container = document.getElementById('history-list');
      if (items.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-900/40 border border-slate-900 rounded-2xl p-10 text-center text-slate-500 text-sm">
            No matching summaries found.
          </div>`;
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="bg-slate-900/70 border border-slate-800/80 hover:border-slate-700/80 rounded-2xl p-5 transition shadow-sm group">
          <div class="flex items-start justify-between gap-4 mb-3">
            <h2 class="font-semibold text-base text-slate-100 tracking-tight">${escapeHtml(item.title)}</h2>
            <div class="flex items-center gap-3 shrink-0">
              <span class="text-xs text-slate-500">${new Date(item.timestamp).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })}</span>
              <button onclick="copyText(this, ${JSON.stringify(item.text).replace(/"/g, '&quot;')})" class="text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg transition flex items-center gap-1.5 opacity-90 sm:opacity-0 group-hover:opacity-100">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                Copy
              </button>
            </div>
          </div>
          <div class="bg-slate-950/60 border border-slate-900 rounded-xl p-3.5 text-xs text-slate-300 font-mono whitespace-pre-wrap max-h-48 overflow-y-auto leading-relaxed">${escapeHtml(item.text)}</div>
        </div>
      `).join('');
    }

    function filterSummaries() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = allSummaries.filter(item => 
        item.title.toLowerCase().includes(query) || 
        item.text.toLowerCase().includes(query)
      );
      renderSummaries(filtered);
    }

    function copyText(btn, text) {
      navigator.clipboard.writeText(text).then(() => {
        const originalHTML = btn.innerHTML;
        btn.innerHTML = `<svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg><span class="text-emerald-400">Copied!</span>`;
        setTimeout(() => {
          btn.innerHTML = originalHTML;
        }, 2000);
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    loadSummaries();
  </script>
</body>
</html>
