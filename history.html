<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#090a0f] text-slate-200 min-h-screen font-sans selection:bg-slate-700 selection:text-white">
  
  <div class="max-w-4xl mx-auto px-6 py-8">
    
    <!-- Main Top Navigation -->
    <nav class="flex items-center gap-2 mb-10 border-b border-white/10 pb-4">
      <button id="nav-data-btn" onclick="switchMainView('data')" class="px-4 py-2 text-sm font-semibold rounded-lg transition bg-white/10 text-white">AI Summaries</button>
      <button id="nav-portal-btn" onclick="switchMainView('portal')" class="px-4 py-2 text-sm font-semibold rounded-lg transition text-slate-400 hover:text-white hover:bg-white/5">Portal Controller</button>
    </nav>

    <!-- ========================================== -->
    <!-- VIEW 1: AI SUMMARIES & LOGS                -->
    <!-- ========================================== -->
    <div id="view-data" class="block">
      <header class="mb-6">
        <h1 class="text-xl font-semibold tracking-tight text-white">AI Summaries & Logs</h1>
        <p class="text-xs text-slate-400 mt-1">Review your AI-generated summaries and their linked device telemetry.</p>
      </header>

      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
        <input type="text" id="search-input" oninput="renderSummaries()" placeholder="Filter entries..." class="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-white/30 transition">
        <div class="flex items-center gap-3 shrink-0">
          <select id="sort-select" onchange="renderSummaries()" class="bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-xs text-slate-300 focus:outline-none focus:border-white/30 transition">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
          </select>
          <button onclick="loadAllData()" class="bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 text-xs px-3.5 py-2 rounded-lg transition active:scale-95">Refresh</button>
          <button onclick="clearAllData()" class="bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 text-red-400 text-xs px-3.5 py-2 rounded-lg transition active:scale-95">Clear All</button>
        </div>
      </div>

      <div id="content-container" class="space-y-3">
        <div class="text-center py-20 text-xs text-slate-500">Loading data...</div>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- VIEW 2: PORTAL CONTROLLER                  -->
    <!-- ========================================== -->
    <div id="view-portal" class="hidden">
      <header class="mb-8">
        <h1 class="text-xl font-semibold tracking-tight text-white">Portal Controller</h1>
        <p class="text-xs text-slate-400 mt-1">Configure your active magic links and decoy redirect.</p>
      </header>

      <div class="space-y-6 max-w-lg">
        <!-- Master Redirect -->
        <div>
          <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 block">Master Decoy Redirect</label>
          <div class="bg-black/30 border border-white/10 rounded-xl p-4">
            <label class="text-[11px] text-slate-500 block mb-1">URL when spectator clicks off or taps back</label>
            <input type="text" id="masterRedirect" class="w-full bg-black/50 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500/50 transition">
          </div>
        </div>

        <!-- Portal Buttons -->
        <div>
          <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 block">Portal Buttons</label>
          <div id="portal-links-list" class="space-y-3"></div>
          
          <button onclick="addPortalLink()" class="w-full mt-3 bg-black/30 hover:bg-black/50 border border-dashed border-white/20 text-indigo-400 hover:text-indigo-300 text-sm font-semibold rounded-xl py-3.5 transition">
            + Add Button
          </button>
        </div>

        <button onclick="savePortalData()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl py-4 shadow-lg shadow-indigo-900/20 transition active:scale-[0.98]">
          Save All Changes
        </button>
      </div>
    </div>

  </div>

  <!-- ========================================== -->
  <!-- MODAL 1: LARGE AI SUMMARY READER             -->
  <!-- ========================================== -->
  <div id="summary-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#12131c] border border-white/10 rounded-2xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between px-6 py-4 border-b border-white/10 bg-black/20">
        <h2 class="text-sm font-semibold text-white flex items-center gap-2">
          <span id="summary-modal-title">AI Summary</span>
          <span id="summary-modal-timestamp" class="text-[11px] text-slate-500 font-normal mt-0.5"></span>
        </h2>
        <div class="flex items-center gap-2">
          <button onclick="copyFullSummary()" class="text-slate-400 hover:text-white text-xs px-2.5 py-1 rounded-lg bg-white/5 hover:bg-white/10 transition" id="btn-copy-summary">Copy</button>
          <button onclick="closeSummaryModal()" class="text-slate-400 hover:text
